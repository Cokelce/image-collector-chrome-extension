<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片收藏夹</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="header">
      <div class="header-left">
        <img class="logo" src="../icons/icon48.png" alt="">
        <h1>图片收藏夹</h1>
      </div>
      <div class="header-right">
        <button class="drive-pill" id="btnDriveStatus" title="Drive 云同步">
          <span class="drive-dot" id="driveDot"></span>
          <span id="driveLabel">本机</span>
        </button>
        <span class="count-badge" id="imageCount">0</span>
      </div>
    </header>

    <!-- 搜索与分类工具栏 -->
    <section class="toolbar-shell">
      <div class="search-bar">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="插画、简单、动漫..." autocomplete="off">
        <button class="clear-search" id="clearSearch">✕</button>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="unclassified">未分类</button>
        <button class="filter-btn" id="advancedFilterToggle">筛选</button>
      </div>
      <div class="category-list" id="categoryList"></div>
    </section>

    <div class="advanced-filter-panel" id="advancedFilterPanel">
      <div class="filter-group">
        <span class="filter-label">类型</span>
        <button class="mini-filter active" data-advanced-field="mediaType" data-advanced-value="all">全部</button>
        <button class="mini-filter" data-advanced-field="mediaType" data-advanced-value="image">图片</button>
        <button class="mini-filter" data-advanced-field="mediaType" data-advanced-value="video">动图</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">方向</span>
        <button class="mini-filter active" data-advanced-field="orientation" data-advanced-value="all">全部</button>
        <button class="mini-filter" data-advanced-field="orientation" data-advanced-value="landscape">横图</button>
        <button class="mini-filter" data-advanced-field="orientation" data-advanced-value="portrait">竖图</button>
        <button class="mini-filter" data-advanced-field="orientation" data-advanced-value="square">方图</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">保存</span>
        <button class="mini-filter active" data-advanced-field="storage" data-advanced-value="all">全部</button>
        <button class="mini-filter" data-advanced-field="storage" data-advanced-value="local">本机</button>
        <button class="mini-filter" data-advanced-field="storage" data-advanced-value="link">链接</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">来源</span>
        <button class="mini-filter active" data-advanced-field="source" data-advanced-value="all">全部</button>
        <button class="mini-filter" data-advanced-field="source" data-advanced-value="haowallpaper">haowallpaper</button>
        <button class="mini-filter" data-advanced-field="source" data-advanced-value="other">其他</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">色系</span>
        <button class="mini-filter active" data-advanced-field="color" data-advanced-value="all">全部</button>
        <button class="mini-filter" data-advanced-field="color" data-advanced-value="蓝色">蓝色</button>
        <button class="mini-filter" data-advanced-field="color" data-advanced-value="绿色">绿色</button>
        <button class="mini-filter" data-advanced-field="color" data-advanced-value="暖色">暖色</button>
        <button class="mini-filter" data-advanced-field="color" data-advanced-value="低饱和">低饱和</button>
      </div>
      <button class="filter-clear-btn" id="advancedFilterClear">清除筛选</button>
    </div>

    <!-- 图片网格 -->
    <div class="gallery" id="gallery">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📁</div>
        <p>还没有收藏图片</p>
        <p class="empty-hint">在网页图片或动图上右键，选择“收藏这个图片/动图”</p>
      </div>
    </div>

    <!-- 底部操作栏 -->
    <footer class="footer">
      <button class="footer-btn" id="btnRefresh" title="刷新">
        <span>🔄</span>
      </button>
      <button class="footer-btn" id="btnExport" title="导出">
        <span>📤</span>
      </button>
      <button class="footer-btn danger" id="btnClear" title="清空">
        <span>🗑️</span>
      </button>
    </footer>
  </div>

  <!-- 分类编辑弹窗 -->
  <div class="category-editor-overlay" id="categoryEditorOverlay">
    <div class="category-editor-card">
      <button class="category-editor-close" id="categoryEditorClose">✕</button>
      <h2>修改分类</h2>
      <select id="categoryEditorSelect"></select>
      <input type="text" id="categoryEditorCustom" placeholder="输入自定义分类" autocomplete="off">
      <div class="category-editor-actions">
        <button class="action-btn" id="categoryEditorCancel">取消</button>
        <button class="action-btn primary" id="categoryEditorSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 图片预览弹窗 -->
  <div class="preview-overlay" id="previewOverlay">
    <div class="preview-card">
      <button class="preview-close" id="previewClose">✕</button>
      <div class="preview-image-wrap">
        <img id="previewImage" src="" alt="预览">
        <video id="previewVideo" muted loop controls playsinline></video>
      </div>
      <div class="preview-info">
        <div class="preview-meta" id="previewMeta"></div>
        <div class="preview-tags" id="previewTags"></div>
        <div class="preview-actions">
          <button class="action-btn" id="btnOpenFile">📂 下载文件</button>
          <button class="action-btn" id="btnCopyUrl">🔗 复制链接</button>
          <button class="action-btn danger" id="btnDelete">🗑️ 删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../analyzer/analyzer.js"></script>
  <script src="../lib/db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
